# Smart-account relayer API (elysium-sa-api.service, 127.0.0.1:8790). Include inside the site's `server {}` block,
# next to the existing /elysium-api/status location (the vault keeper). Only /elysium-api/sa/ goes to sa-api.
#
# Needs, once, in `http {}`:
#   limit_req_zone $binary_remote_addr zone=elysium_sa_onboard:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=elysium_sa_read:10m rate=120r/m;
# Behind Cloudflare: set real_ip_header CF-Connecting-IP + set_real_ip_from <CF ranges> first, so $remote_addr (and
# the X-Real-IP sent below, which sa-api uses for its own per-IP limit) is the client, not the CDN.
# The API logs addresses and outcome codes only; consider `access_log off;` here if the site log keeps client IPs.

location = /elysium-api/sa/onboard {
    limit_except POST { deny all; }
    limit_req zone=elysium_sa_onboard burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    proxy_request_buffering on;            # nginx takes the whole body before the API sees it
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # overwrites anything the client sent
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;                # verification reads the chain (a few eth_calls)
    add_header Cache-Control "no-store" always;
}

location ~ ^/elysium-api/sa/(status|health)$ {
    limit_except GET { deny all; }
    limit_req zone=elysium_sa_read burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}

location /elysium-api/sa/ {                 # anything else under sa/ (the regex above wins over this prefix)
    return 404;
}
